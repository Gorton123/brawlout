name: AI tools test (UniRig + MoMask)

# Stage 1 (python, open internet): call the UniRig / MoMask / TRELLIS Spaces and save raw outputs to tests/ai/out/.
# Stage 2 (local or here): map, retarget and render contact sheets with pipeline/ai_tests.mjs.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | unirig | momask | all'
        required: true
        default: probe

permissions:
  contents: write

concurrency:
  group: ai-tests
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gradio_client pillow
      - name: Probe
        if: github.event.inputs.mode == 'probe'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tests/ai/probe.py
      - name: UniRig
        if: github.event.inputs.mode == 'unirig' || github.event.inputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 120
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tests/ai/run.py unirig
      - name: Save UniRig outputs
        if: always()
        run: |
          git config user.name "brawlout-bot"; git config user.email "actions@users.noreply.github.com"
          git add tests/ai/out characters/lion characters/roster.json 2>/dev/null || true
          if git diff --cached --quiet; then echo nothing; else git commit -m "ai-tests: unirig outputs [skip ci]" && git pull --rebase && git push; fi
      - name: MoMask (old gradio client - the Space runs Gradio 3)
        if: github.event.inputs.mode == 'momask' || github.event.inputs.mode == 'all'
        continue-on-error: true
        timeout-minutes: 120
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m venv /tmp/old && /tmp/old/bin/pip install -q "gradio_client==0.8.1" pillow
          /tmp/old/bin/python tests/ai/run.py momask
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "brawlout-bot"; git config user.email "actions@users.noreply.github.com"
          git add tests/ai/out characters/lion characters/roster.json 2>/dev/null || true
          if git diff --cached --quiet; then echo nothing; else git commit -m "ai-tests: outputs [skip ci]" && git pull --rebase && git push; fi

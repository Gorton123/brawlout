name: Fetch reference files

# Downloads URLs (one per line in characters/_refs/urls.txt) into characters/_refs/ so they can be reviewed in the repo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['characters/_refs/urls.txt']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          cd characters/_refs
          while read -r url; do [ -z "$url" ] && continue; f=$(basename "${url%%\?*}"); [ -f "$f" ] || curl -sSfL "$url" -o "$f" || echo "failed $url"; done < urls.txt
          ls -la
      - name: Commit
        run: |
          git config user.name "brawlout-bot"; git config user.email "actions@users.noreply.github.com"
          git add characters/_refs
          if git diff --cached --quiet; then echo nothing; else git commit -m "refs: downloaded [skip ci]" && git pull --rebase && git push; fi
